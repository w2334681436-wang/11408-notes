name: Build Baihua Politics APK
on:
  push:
    branches:
      - build/baihua-politics-android-apk
    paths:
      - 'baihua-android-build/**'
      - '.github/workflows/baihua-politics-apk.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android platform
        shell: bash
        run: |
          SDK="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | sort -Vr | head -n 1)"
          if [ -z "$SDK" ]; then echo 'Android sdkmanager missing' >&2; exit 1; fi
          yes | "$SDK" --licenses > /dev/null || true
          "$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Expand Android source archive
        shell: bash
        run: |
          mkdir -p baihua-android-build/source
          base64 --decode baihua-android-build/payload.b64 | tar -xJ -C baihua-android-build/source
          echo '.topic-card-title,.topic-card-desc{display:block;max-width:100%}' >> baihua-android-build/source/app/src/main/assets/app.css
      - name: Build installable debug APK
        working-directory: baihua-android-build/source
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaihuaPolitics-Android-APK
          path: baihua-android-build/source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
